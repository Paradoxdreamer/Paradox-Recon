[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "paradox-recon"
version = "1.3.0"
description = "Paradox Recon — Discovery → Diagnostics → Correlation → Risk → Report"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Paradox Tech" }]
dependencies = [
  "requests>=2.28",
]

[project.scripts]
paradox-recon = "paradox_recon.cli:main"

[tool.setuptools.packages.find]
include = ["paradox_recon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
